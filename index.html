<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>单摆物理模拟器 (交互控制版) · 第 5 周实验</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1a24;
      color: #e0e6ed;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      gap: 14px;
    }
    header { text-align: center; }
    h1 { font-size: 1.35rem; font-weight: 600; color: #f0f4f8; }
    .badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 10px;
      background: rgba(33, 150, 243, 0.16);
      color: #64b5f6;
      border: 1px solid rgba(33, 150, 243, 0.35);
    }
    canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      background: radial-gradient(circle at 50% 30%, #22222f 0%, #14141c 100%);
    }
    /* ---------- 毛玻璃参数控制面板 ---------- */
    .panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 22px;
      width: 100%;
      max-width: 800px;
      padding: 12px 24px;
      background: rgba(30, 30, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }
    .group { display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem; }
    .group-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #90caf9;
      font-weight: 500;
    }
    .value { color: #ffffff; font-family: ui-monospace, Consolas, monospace; }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 150px;
      height: 6px;
      border-radius: 3px;
      background: #33334d;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00e5ff;
      box-shadow: 0 0 8px #00e5ff;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: none;
      border-radius: 50%;
      background: #00e5ff;
      box-shadow: 0 0 8px #00e5ff;
      cursor: pointer;
    }
    .btn {
      align-self: center;
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(30, 136, 229, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%);
      box-shadow: 0 4px 14px rgba(66, 165, 245, 0.55);
      transform: translateY(-1px);
    }
    .btn:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <header>
    <h1>单摆物理模拟器</h1>
    <span class="badge">Task 03 · 参数滑块实时绑定与物理交互</span>
  </header>

  <canvas id="canvas" width="800" height="460"></canvas>

  <div class="panel">
    <div class="group">
      <div class="group-label">
        <span>摆长 L</span><span id="lenVal" class="value">200 px</span>
      </div>
      <input type="range" id="lenSlider" min="100" max="350" step="1" value="200" />
    </div>

    <div class="group">
      <div class="group-label">
        <span>重力 g</span><span id="gravVal" class="value">9.8</span>
      </div>
      <input type="range" id="gravSlider" min="1.0" max="25.0" step="0.1" value="9.8" />
    </div>

    <div class="group">
      <div class="group-label">
        <span>空气阻尼 k</span><span id="dampVal" class="value">0.0020</span>
      </div>
      <input type="range" id="dampSlider" min="0.000" max="0.010" step="0.0005" value="0.002" />
    </div>

    <button id="resetBtn" class="btn">重置摆动</button>
  </div>

  <script>
    // ============================================================
    // 任务三 · 在 MVP 基础上追加实时参数交互
    // 物理方程：α = -(g / L) · sin(θ) - k · ω
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const origin = { x: canvas.width / 2, y: 90 };
    const G_UNIT = 60;       // 像素坐标系标定：1 单位 g 折算为 60 px/s²

    // 可变参数（由滑块实时驱动）
    let LENGTH = 200;
    let GRAVITY = 9.8;
    let DAMPING = 0.002;

    // 初始角度常量
    const INIT_ANGLE = Math.PI / 4;  // 45°

    // 物理状态量
    let theta = INIT_ANGLE;
    let omega = 0;
    let lastTime = performance.now();

    // DOM 引用
    const lenSlider = document.getElementById('lenSlider');
    const gravSlider = document.getElementById('gravSlider');
    const dampSlider = document.getElementById('dampSlider');
    const lenVal = document.getElementById('lenVal');
    const gravVal = document.getElementById('gravVal');
    const dampVal = document.getElementById('dampVal');

    // ---------- 滑块事件绑定：驱动物理参数实时变化 ----------
    lenSlider.addEventListener('input', (e) => {
      LENGTH = parseFloat(e.target.value);
      lenVal.textContent = LENGTH + ' px';
    });

    gravSlider.addEventListener('input', (e) => {
      GRAVITY = parseFloat(e.target.value);
      gravVal.textContent = GRAVITY.toFixed(1);
    });

    dampSlider.addEventListener('input', (e) => {
      DAMPING = parseFloat(e.target.value);
      dampVal.textContent = DAMPING.toFixed(4);
    });

    // 角加速度：α = -(g/L)·sin(θ) - k·ω
    function angularAcceleration(t, w) {
      const gPx = GRAVITY * G_UNIT;
      return -(gPx / LENGTH) * Math.sin(t) - DAMPING * G_UNIT * w;
    }

    function updatePhysics(dt) {
      omega += angularAcceleration(theta, omega) * dt;
      theta += omega * dt;
    }

    // 重置摆动：摆球精准回到 45° 初始状态
    function resetAnimation() {
      theta = INIT_ANGLE;
      omega = 0;
    }

    // 修复根因：不再依赖内联 onclick 的全局查找，改为在同一脚本作用域内直接绑定函数引用
    document.getElementById('resetBtn').addEventListener('click', resetAnimation);

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const bobX = origin.x + LENGTH * Math.sin(theta);
      const bobY = origin.y + LENGTH * Math.cos(theta);

      // 1. 竖直参考线
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(origin.x, origin.y + LENGTH + 40);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.setLineDash([4, 6]);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.setLineDash([]);

      // 2. 摆绳
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(bobX, bobY);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 3. 支点
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#90caf9';
      ctx.shadowColor = '#42a5f5';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      // 4. 摆球（微弱发光）
      ctx.beginPath();
      ctx.arc(bobX, bobY, 18, 0, Math.PI * 2);
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 18;
      ctx.fill();

      // 5. 高光
      ctx.beginPath();
      ctx.arc(bobX - 5, bobY - 5, 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.shadowBlur = 0;
      ctx.fill();
    }

    function animate(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      updatePhysics(dt);
      draw();

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
