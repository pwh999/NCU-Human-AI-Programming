<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>单摆物理模拟器 (MVP) · 第 5 周实验</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1a24;
      color: #e0e6ed;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    header { margin-bottom: 14px; text-align: center; }
    h1 { font-size: 1.35rem; font-weight: 600; color: #f0f4f8; }
    .badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 10px;
      background: rgba(0, 229, 255, 0.12);
      color: #64ffda;
      border: 1px solid rgba(0, 229, 255, 0.3);
    }
    canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      background: radial-gradient(circle at 50% 30%, #22222f 0%, #14141c 100%);
    }
  </style>
</head>
<body>
  <header>
    <h1>单摆物理模拟器</h1>
    <span class="badge">Task 02 · MVP：Canvas 简谐振动</span>
  </header>

  <canvas id="canvas" width="800" height="460"></canvas>

  <script>
    // ============================================================
    // 任务二 · 单摆物理模拟器 MVP
    // 单摆角加速度微分方程：α = -(g / L) · sin(θ) - k · ω
    // 仅验证「摆球能不能平滑摆动」这一件事，参数先写死。
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 支点位置
    const origin = { x: canvas.width / 2, y: 90 };

    // 初始参数（写死）
    const LENGTH = 200;      // 摆长 L = 200 px
    const GRAVITY = 9.8;     // 重力加速度 g = 9.8
    const DAMPING = 0.002;   // 空气阻尼系数 k
    const G_UNIT = 60;       // 像素坐标系标定：1 单位 g 折算为 60 px/s²

    // 物理状态量
    let theta = Math.PI / 4; // 初始摆角 45°
    let omega = 0;           // 角速度 ω
    let lastTime = performance.now();

    // 角加速度：α = -(g/L)·sin(θ) - k·ω
    function angularAcceleration(t, w) {
      const gPx = GRAVITY * G_UNIT;
      return -(gPx / LENGTH) * Math.sin(t) - DAMPING * G_UNIT * w;
    }

    function updatePhysics(dt) {
      // 半隐式欧拉积分：先更新角速度，再用新角速度更新角度，能量更稳定
      omega += angularAcceleration(theta, omega) * dt;
      theta += omega * dt;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const bobX = origin.x + LENGTH * Math.sin(theta);
      const bobY = origin.y + LENGTH * Math.cos(theta);

      // 1. 竖直参考线
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(origin.x, origin.y + LENGTH + 40);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.setLineDash([4, 6]);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.setLineDash([]);

      // 2. 摆绳
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(bobX, bobY);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 3. 支点
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#90caf9';
      ctx.shadowColor = '#42a5f5';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      // 4. 摆球（微弱发光）
      ctx.beginPath();
      ctx.arc(bobX, bobY, 18, 0, Math.PI * 2);
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 18;
      ctx.fill();

      // 5. 高光
      ctx.beginPath();
      ctx.arc(bobX - 5, bobY - 5, 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.shadowBlur = 0;
      ctx.fill();
    }

    function animate(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      updatePhysics(dt);
      draw();

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
